<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAM-6250 Monitor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #2c3e50;
        color: white;
        margin: 0;
        padding: 20px;
    }
    .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }
    .card {
        background: #34495e;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin-bottom: 20px; color: white; }
    .signal {
        font-size: 100px;
        font-weight: bold;
        margin: 30px 0;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        transition: all 0.3s;
    }
    .signal-0 { background: #7f8c8d; }
    .signal-1 { background: #e74c3c; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.7; } }
    .image-preview { text-align: center; margin: 20px 0; }
    .image-preview img { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .logs-container { max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; }
    .log-entry { padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.1); border-radius: 5px; font-size: 0.9rem; }
    .log-error { background: rgba(231, 76, 60, 0.3); }
    .log-success { background: rgba(46, 204, 113, 0.3); }
    .log-time { color: #95a5a6; font-size: 0.8rem; }
    .download-btn { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
    .download-btn:hover { background: #2980b9; }
</style>
<script>
function updateStatus() {
    fetch('/api/status')
        .then(r => r.json())
        .then(data => {
            const signalTitle = document.getElementById('signal-title');
            signalTitle.textContent = 'ADAM-6250 Signal Monitor - ' + (data.signal || 'OFF');

            const signalDiv = document.getElementById('signal');
            if (data.signal.startsWith('ON')) {
                signalDiv.className = 'signal signal-1';
            } else {
                signalDiv.className = 'signal signal-0';
            }
            signalDiv.textContent = data.signal || 'OFF';

            const imagePreview = document.getElementById('image-preview');
            if (data.image_data) {
                imagePreview.innerHTML = '<img src="data:image/png;base64,' + data.image_data + '" alt="' + data.signal + '">';
            } else {
                imagePreview.innerHTML = '<p>No Image</p>';
            }

            updateLogs(data.logs);

            document.getElementById('time').textContent = new Date().toLocaleString('en-US');
        })
        .catch(err => console.error('Update error:', err));
}

function updateLogs(logs) {
    const logsDiv = document.getElementById('logs');
    if (logs && logs.length > 0) {
        logsDiv.innerHTML = logs.slice(0, 20).map(log => {
            const statusClass = log.status === 'ERROR' ? 'log-error' : 'log-success';
            return '<div class="log-entry ' + statusClass + '">' +
                   '<div class="log-time">' + new Date(log.timestamp).toLocaleString('en-US') + '</div>' +
                   '<div>' + log.source + ': ' + log.message + '</div>' +
                   '</div>';
        }).join('');
    }
}

function downloadCSV() {
    window.location.href = '/api/download_csv';
}

updateStatus();
setInterval(updateStatus, 1000);
</script>
</head>
<body>
<div class="dashboard">
    <div class="card">
        <h2 id="signal-title">ADAM-6250 Signal Monitor - OFF</h2>
        <div id="signal" class="signal signal-0">OFF</div>
        <div style="color: #95a5a6; font-size: 0.9rem; margin-top: 10px;">
            Updated: <span id="time">-</span>
        </div>
    </div>

    <div class="card">
        <h2>Image Preview</h2>
        <div class="image-preview" id="image-preview">
            <p>Loading image...</p>
        </div>
    </div>

    <div class="card">
        <h2>Communication Logs</h2>
        <button class="download-btn" onclick="downloadCSV()">Download CSV</button>
        <div class="logs-container" id="logs">
            <div class="log-entry">Waiting for logs...</div>
        </div>
    </div>
</div>
</body>
</html>
